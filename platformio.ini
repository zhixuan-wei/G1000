; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = mega_pfd_mfd
boards_dir = boards

[env:mega_pfd_mfd]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -D SERIAL_TX_BUFFER_SIZE=128 -D SERIAL_RX_BUFFER_SIZE=32 -D XFD_UNIT=1

[env:micro_pfd]
platform = atmelavr
; (2026-09-12) 与 micro_mfd 相同：必须用伪装板定义（boards/mrusk_promicro.json，
; VID/PID 0x2341:0x0010）才能通过 RealSimGear 驱动的 Arduino VID 白名单枚举。
; 握手设备名由 G1000.cpp 的 DEVICE_NAME 决定（unit 11 -> mrusk-G1000XFD2）。
board = mrusk_promicro
framework = arduino
monitor_speed = 115200
build_flags = -D SERIAL_TX_BUFFER_SIZE=128 -D SERIAL_RX_BUFFER_SIZE=32 -D XFD_UNIT=11

[env:micro_mfd]
platform = atmelavr
; EXPERIMENT 2 (2026-09-12): custom board copy (boards/mrusk_promicro.json) spoofs USB
; VID/PID as Arduino Mega 2560 (0x2341:0x0010) to pass the RealSimGear driver's hardcoded
; whitelist (driver skips non-Arduino VIDs at enumeration). Handshake name unchanged.
; Revert: change board back to sparkfun_promicro16.
board = mrusk_promicro
framework = arduino
monitor_speed = 115200
build_flags = -D SERIAL_TX_BUFFER_SIZE=128 -D SERIAL_RX_BUFFER_SIZE=32 -D XFD_UNIT=12

[env:demo_mfd]
; DEMO (2026-09-12): 按键未接线，固件周期模拟按键/编码器事件，验证端到端映射链路。
; 只编译 src/DemoButtons.cpp（需 DEMO_BUILD 宏，src_filter 排除 G1000.cpp）。
; DemoButtons.cpp 包在 #ifdef DEMO_BUILD 里，其余 env 编译它为空单元，互不影响。
; 恢复正式固件: pio run -e micro_mfd -t upload --upload-port COM11
board = mrusk_promicro
framework = arduino
platform = atmelavr
monitor_speed = 115200
build_flags = -D SERIAL_TX_BUFFER_SIZE=128 -D SERIAL_RX_BUFFER_SIZE=32 -D XFD_UNIT=12 -D DEMO_BUILD
build_src_filter = -<G1000.cpp> +<DemoButtons.cpp>

[env:demo_pfd]
; DEMO (2026-09-12): PFD 板（unit 11）demo，与 demo_mfd 同框架。
; DemoButtons.cpp v3 按 XFD_UNIT 自动切换握手名（mrusk-G1000XFD2 / 0011）与
; PFD 动作表（61 项，无 AP 键）。恢复正式固件: pio run -e micro_pfd -t upload
board = mrusk_promicro
framework = arduino
platform = atmelavr
monitor_speed = 115200
build_flags = -D SERIAL_TX_BUFFER_SIZE=128 -D SERIAL_RX_BUFFER_SIZE=32 -D XFD_UNIT=11 -D DEMO_BUILD
build_src_filter = -<G1000.cpp> +<DemoButtons.cpp>
