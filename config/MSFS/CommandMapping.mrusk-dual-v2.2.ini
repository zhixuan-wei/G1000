# ============================================================
# 存档：mrusk 双控制器实测可用驱动映射 v2.2（2026-09-14 测试通过）
# 用法：整文件复制到 "%LOCALAPPDATA%\RealSimGear MSFS Device Interface\CommandMapping.ini"
#       （覆盖前建议先备份原文件），然后在驱动窗口点 Reload Command Map。
# ============================================================
# RealSimGear CommandMapping - mrusk DIY G1000 dual-controller (2026-09-12)
# version 2.2 (BTN pressed-edge fix; AP keys active since v2.1):
#   - [mrusk-G1000XFD1#1] = MFD board  (unit 12, G1000.cpp DEVICE_NAME "mrusk-G1000XFD1")
#   - [mrusk-G1000XFD2#1] = PFD board  (unit 11, G1000.cpp DEVICE_NAME "mrusk-G1000XFD2")
#   - v2.2 edge-fix: bare "=" is a HELD event and repeats the action while the
#     key is pressed (AP/softkey/FMS/FF/PAN/radio keys all multi-fired). All
#     BTN rules now use "+=" (pressed edge, single fire). NOSE stays "-="
#     (released edge), BTN_CLR keeps the 2.0^ long-press syntax, ENC_*/Range
#     keep bare "=" (firmware emits exactly one event per detent), and LED
#     rows "<N=" are untouched.
#   - XFD2 section = official RSG PFD key set (H:AS1000_PFD_*), dash-less keys,
#     same dash-fix rule as v1.4. Since v2.1 firmware unit 11 runs AP_NXI=1:
#     the 12 AP keys (BTN_AP/FD/NAV/ALT/VS/FLC/YD/HDG/APR/VNAV/NOSE_UP/NOSE_DN)
#     are active on BOTH boards (each wired to MUX module 2 ch0-11, NXI key order).
# Key-name rule: DIY firmware sends dash-less events (BTN_AP=1); official RSG keys
#   carry a trailing dash (BTN_AP-=...) and would never match.
# Kept disabled (official UNAVAILABLE, expected warnings if firmware sends them):
#   BTN_NAV_VOL / BTN_ALT_SEL / BTN_COM_VOL (both sections)
# PFD board LEFT_PANEL disabled since v2.1 (G1000.cpp unit 11 LEFT_PANEL 1->0):
#   MUX 2 ch0-11 reassigned to AP keys; a Pro Micro reads only 6 mux modules
#   (96 ch) and 63+12+25=101 > 96, so the three panels cannot coexist. The SW_*
#   keys were never wired nor mapped - disabling them loses nothing.
# Restore points in this folder:
#   .v1.4-MFD (single MFD map) | .bak-20260912-dashfix (v1.3) | .bak-20260912-exp3
#   .bak-20260912-ap (v2.0, before AP-key activation)
#   .bak-20260914-edgefix (v2.1, before BTN held->pressed edge fix)
# =====================================================================
[metadata]
version=2.2
description=User CommandMap Customisations - mrusk DIY G1000 dual-controller (v2.2: BTN pressed-edge fix on both boards; XFD1=MFD micro, XFD2=PFD micro)

[mrusk-G1000XFD1#1]
ENC_NAV_VOL_DN=H:AS1000_MFD_VOL_1_DEC
ENC_NAV_VOL_UP=H:AS1000_MFD_VOL_1_INC
ENC_COM_VOL_DN=H:AS1000_MFD_VOL_2_DEC
ENC_COM_VOL_UP=H:AS1000_MFD_VOL_2_INC
; BTN_NAV_VOL=UNAVAILABLE
BTN_NAV_FF+=H:AS1000_MFD_NAV_Switch
ENC_NAV_OUTER_UP=H:AS1000_MFD_NAV_Large_INC
ENC_NAV_OUTER_DN=H:AS1000_MFD_NAV_Large_DEC
ENC_NAV_INNER_UP=H:AS1000_MFD_NAV_Small_INC
ENC_NAV_INNER_DN=H:AS1000_MFD_NAV_Small_DEC
BTN_NAV_TOG+=H:AS1000_MFD_NAV_Push
ENC_HDG_DN=HEADING_BUG_DEC
ENC_HDG_UP=HEADING_BUG_INC
BTN_HDG_SYNC+=HEADING_BUG_SET#PLANE HEADING DEGREES MAGNETIC|Degrees
BTN_AP+=AP_MASTER
BTN_FD+=TOGGLE_FLIGHT_DIRECTOR
BTN_YD+=YAW_DAMPER_TOGGLE
BTN_HDG+=AP_PANEL_HEADING_HOLD
BTN_ALT+=AP_PANEL_ALTITUDE_HOLD
BTN_NAV+=AP_NAV1_HOLD
BTN_VNAV+=H:AS1000_VNAV_TOGGLE
BTN_APR+=AP_APR_HOLD
BTN_BC+=AP_BC_HOLD
BTN_VS+=AP_PANEL_VS_HOLD
BTN_NOSE_UP@AUTOPILOT FLIGHT LEVEL CHANGE|Bool#1-=AP_SPD_VAR_DEC
BTN_NOSE_UP@AUTOPILOT FLIGHT LEVEL CHANGE|Bool#0-=AP_VS_VAR_INC
BTN_NOSE_DN@AUTOPILOT FLIGHT LEVEL CHANGE|Bool#1-=AP_SPD_VAR_INC
BTN_NOSE_DN@AUTOPILOT FLIGHT LEVEL CHANGE|Bool#0-=AP_VS_VAR_DEC
BTN_FLC+=FLIGHT_LEVEL_CHANGE
ENC_ALT_OUTER_UP=AP_ALT_VAR_INC#1000
ENC_ALT_OUTER_DN=AP_ALT_VAR_DEC#1000
ENC_ALT_INNER_UP=AP_ALT_VAR_INC#100
ENC_ALT_INNER_DN=AP_ALT_VAR_DEC#100
; BTN_ALT_SEL=UNAVAILABLE
BTN_COM_FF+=H:AS1000_MFD_COM_Switch
; BTN_COM_VOL=UNAVAILABLE
ENC_COM_OUTER_UP=H:AS1000_MFD_COM_Large_INC
ENC_COM_OUTER_DN=H:AS1000_MFD_COM_Large_DEC
ENC_COM_INNER_UP=H:AS1000_MFD_COM_Small_INC
ENC_COM_INNER_DN=H:AS1000_MFD_COM_Small_DEC
BTN_COM_TOG+=H:AS1000_MFD_COM_Push
ENC_CRS_UP=H:AS1000_MFD_CRS_INC
ENC_CRS_DN=H:AS1000_MFD_CRS_DEC
BTN_CRS_SYNC+=H:AS1000_MFD_CRS_PUSH
ENC_RANGE_UP=H:AS1000_MFD_RANGE_INC
ENC_RANGE_DN=H:AS1000_MFD_RANGE_DEC
ENC_BARO_UP=[KOHLSMAN_INC,KOHLSMAN_INC#2,KOHLSMAN_INC#5]
ENC_BARO_DN=[KOHLSMAN_DEC,KOHLSMAN_DEC#2,KOHLSMAN_DEC#5]
BTN_PAN_SYNC+=H:AS1000_MFD_JOYSTICK_PUSH
BTN_PAN_UP+=H:AS1000_MFD_JOYSTICK_UP
BTN_PAN_DN+=H:AS1000_MFD_JOYSTICK_DOWN
BTN_PAN_LEFT+=H:AS1000_MFD_JOYSTICK_LEFT
BTN_PAN_RIGHT+=H:AS1000_MFD_JOYSTICK_RIGHT
BTN_FMS+=H:AS1000_MFD_FMS_Upper_PUSH
ENC_FMS_OUTER_UP=H:AS1000_MFD_FMS_Lower_INC
ENC_FMS_OUTER_DN=H:AS1000_MFD_FMS_Lower_DEC
ENC_FMS_INNER_UP=H:AS1000_MFD_FMS_Upper_INC
ENC_FMS_INNER_DN=H:AS1000_MFD_FMS_Upper_DEC
BTN_SOFT_1+=H:AS1000_MFD_SOFTKEYS_1
BTN_SOFT_2+=H:AS1000_MFD_SOFTKEYS_2
BTN_SOFT_3+=H:AS1000_MFD_SOFTKEYS_3
BTN_SOFT_4+=H:AS1000_MFD_SOFTKEYS_4
BTN_SOFT_5+=H:AS1000_MFD_SOFTKEYS_5
BTN_SOFT_6+=H:AS1000_MFD_SOFTKEYS_6
BTN_SOFT_7+=H:AS1000_MFD_SOFTKEYS_7
BTN_SOFT_8+=H:AS1000_MFD_SOFTKEYS_8
BTN_SOFT_9+=H:AS1000_MFD_SOFTKEYS_9
BTN_SOFT_10+=H:AS1000_MFD_SOFTKEYS_10
BTN_SOFT_11+=H:AS1000_MFD_SOFTKEYS_11
BTN_SOFT_12+=H:AS1000_MFD_SOFTKEYS_12
BTN_DIRECT+=H:AS1000_MFD_DIRECTTO
BTN_MENU+=H:AS1000_MFD_Menu_Push
BTN_FPL+=H:AS1000_MFD_FPL_Push
BTN_PROC+=H:AS1000_MFD_PROC_Push
BTN_CLR=2.0^H:AS1000_MFD_CLR^H:AS1000_MFD_CLR_Long
BTN_ENT+=H:AS1000_MFD_ENT_Push
BTN_DME+=RADIO_DME1_IDENT_TOGGLE
BTN_MKR+=MARKER_BEACON_TEST_MUTE#1
BTN_MIC1+=PILOT_TRANSMITTER_SET#1
BTN_MIC2+=PILOT_TRANSMITTER_SET#0
BTN_COM1@COM RECEIVE:1|Bool#0+=COM1_RECEIVE_SELECT#1
BTN_COM1@COM RECEIVE:1|Bool#1+=COM1_RECEIVE_SELECT#0
BTN_COM2@COM RECEIVE:2|Bool#0+=COM2_RECEIVE_SELECT#1
BTN_COM2@COM RECEIVE:2|Bool#1+=COM2_RECEIVE_SELECT#0
BTN_NAV1+=RADIO_VOR1_IDENT_TOGGLE
BTN_NAV2+=RADIO_VOR2_IDENT_TOGGLE
BTN_ADF+=RADIO_ADF_IDENT_TOGGLE
BTN_REVERSION+=[((L:AS1000_MID_Display_Backup_Active) ! (>L:AS1000_MID_Display_Backup_Active)),((L:AS1000_MIDCom_Display_Backup_Active) ! (>L:AS1000_MIDCom_Display_Backup_Active))]
# These represent the index in the led array NOT the pin
<0=COM RECEIVE:1|Bool#1
<1=COM RECEIVE:2|Bool#1
<2=NAV SOUND:1|Bool#1
<3=NAV SOUND:2|Bool#1
<4=ADF SOUND|Bool#1
<5=DME SOUND|Bool#1
<6=MARKER SOUND|Bool#1
<7=COM TRANSMIT:1|Bool#1
<8=COM TRANSMIT:2|Bool#1

